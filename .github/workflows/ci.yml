name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The rule table is the single source of truth for both languages. If the
      # generated JSON drifts from src/rules.ts, the Python corpus and the
      # browser runtime are silently disagreeing about what `kh` means.
      - name: Rule table is in sync
        run: |
          node scripts/export-rules.ts
          git diff --exit-code data/rules/graphemes.json

      - name: Fixture suite
        run: node scripts/run-fixtures.ts

      # The primary budget. This is the constraint users feel, and it only
      # holds if it is enforced mechanically.
      - name: Latency budget
        run: node scripts/bench.ts

      # Secondary: reported every build, soft-capped. Exceeding it is a
      # deliberate decision, not an automatic failure, so this never fails.
      - name: Size report
        run: node scripts/size.ts --json

      - name: Python/browser parity
        run: node scripts/parity.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-report
          path: dist/size.json

  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: training } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install torch numpy pytest brotli --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Python tests
        run: python -m pytest tests -q
