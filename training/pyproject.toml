[project]
name = "tiny-finglish-training"
version = "0.0.0"
description = "Corpus generation, PyTorch training, evaluation and quantized export for tiny-finglish."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiny_finglish_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
